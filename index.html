<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : indispensable pour que l'app passe sous l'encoche et la barre d'accueil iOS -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="description" content="Atlas — capturer, faire mûrir, fabriquer ses idées." />

    <!-- iOS : mode plein écran une fois ajoutée à l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <!-- default = la barre d'état garde le style du thème courant (mis à jour par le ThemeProvider) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#eceff6" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignore le manifeste pour l'icône : il lui faut apple-touch-icon -->
    <link rel="apple-touch-icon" href="/icone-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />

    <title>Atlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
