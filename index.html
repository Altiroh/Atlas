<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : indispensable pour que l'app passe sous l'encoche et la barre d'accueil iOS.

         PAS DE ZOOM. Atlas n'est pas un document : c'est une coque à
         hauteur fixe (100dvh) avec ses propres zones de défilement.
         Zoomer dedans ne grossit pas le texte — ça décale la coque hors
         de l'écran, et la barre d'onglets disparaît. Le pincement est
         donc rendu à la carte mentale et au dessin, qui en font quelque
         chose, et retiré de l'app elle-même. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="description" content="Atlas — capturer, faire mûrir, fabriquer ses idées." />

    <!-- iOS : mode plein écran une fois ajoutée à l'écran d'accueil -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <!-- default = la barre d'état garde le style du thème courant (mis à jour par le ThemeProvider) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#eceff6" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignore le manifeste pour l'icône : il lui faut apple-touch-icon -->
    <link rel="apple-touch-icon" href="/icone-180.png" />
    <!-- l'onglet affiche 16 px : à cette taille c'est la 32 qui est nette, pas la 192 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icone-192.png" />

    <title>Atlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
